services:
  database:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-localmateai}"
      POSTGRES_USER: "${POSTGRES_USER:-localmate}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - localmate-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: LocalMateAI.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5286
      ConnectionStrings__DefaultConnection: "Host=database;Port=5432;Database=${POSTGRES_DB:-localmateai};Username=${POSTGRES_USER:-localmate};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Jwt__SigningKey: "${Jwt__SigningKey:?Set Jwt__SigningKey in .env}"
      GoogleAuth__ClientId: "${GoogleAuth__ClientId:?Set GoogleAuth__ClientId in .env}"
    ports:
      - "5286:5286"
    depends_on:
      database:
        condition: service_healthy

volumes:
  localmate-postgres-data: